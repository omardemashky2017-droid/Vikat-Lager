<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lagerplatz Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #top-bar {
      height: 50px;
      background: #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid #444;
      z-index: 10;
    }

    .upload-btn {
      background: #00ffcc;
      color: #000;
      padding: 6px 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    #camera-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .scan-target {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 75%; height: 100px;
      border: 3px dashed #00ffcc;
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    #result-panel {
      height: 35vh;
      background-color: #1a1a1a;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 15px;
      border-top: 4px solid #333;
    }
    
    .detected-text { font-size: 1.1rem; color: #aaa; margin-bottom: 5px; }
    .shelf-display { font-size: 3.2rem; font-weight: bold; color: #00ffcc; line-height: 1.1; }
    .status-text { font-size: 0.85rem; color: #ff9900; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="top-bar">
    <span id="db-count" style="font-size:0.8rem; color:#aaa;">DB: Keine Daten</span>
    <label class="upload-btn">
      📁 CSV Laden
      <input type="file" id="csv-input" accept=".csv" style="display:none;">
    </label>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-target"></div>
  </div>

  <div id="result-panel">
    <div class="detected-text" id="read-number">Gelesen: --</div>
    <div class="shelf-display" id="shelf-location">SUCHE...</div>
    <div class="status-text" id="status">Kamera wird gestartet...</div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let inventoryDatabase = {};

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const readNumberEl = document.getElementById('read-number');
    const shelfLocationEl = document.getElementById('shelf-location');
    const statusEl = document.getElementById('status');
    const dbCountEl = document.getElementById('db-count');
    const csvInput = document.getElementById('csv-input');

    let worker = null;
    let isProcessing = false;

    // Load saved database from phone's browser memory on page load
    function loadSavedDatabase() {
      const savedDB = localStorage.getItem('vikat_lager_db');
      if (savedDB) {
        inventoryDatabase = JSON.parse(savedDB);
        const count = Object.keys(inventoryDatabase).length;
        dbCountEl.innerText = `DB: ${count} Artikel gespeichert`;
      } else {
        dbCountEl.innerText = "DB: Bitte CSV laden";
      }
    }

    // Handle CSV Upload and Save to Phone Memory
    csvInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        parseAndSaveCSV(evt.target.result);
      };
      reader.readAsText(file);
    });

    function parseAndSaveCSV(text) {
      const lines = text.split('\n');
      const newDB = {};
      let count = 0;

      lines.forEach(line => {
        const parts = line.split(/[,;]/);
        if (parts.length >= 2) {
          const artNr = parts[0].trim().replace(/[^0-9-]/g, '');
          const shelf = parts[1].trim();
          if (artNr && shelf) {
            newDB[artNr] = shelf;
            count++;
          }
        }
      });

      if (count > 0) {
        inventoryDatabase = newDB;
        // Save to browser memory (LocalStorage)
        localStorage.setItem('vikat_lager_db', JSON.stringify(newDB));
        dbCountEl.innerText = `DB: ${count} Artikel gespeichert`;
        statusEl.innerText = "Datenbank dauerhaft gespeichert!";
      } else {
        alert("Fehler beim Lesen der CSV-Datei. Format: Artikelnummer,Lagerplatz");
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        });
        video.srcObject = stream;
      } catch (err) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      }
      statusEl.innerText = "OCR bereit. Nummern im Rahmen ausrichten.";
      initOCR();
    }

    async function initOCR() {
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789-',
      });
      statusEl.innerText = "Scanne kontinuierlich...";
      requestAnimationFrame(processFrame);
    }

    async function processFrame() {
      if (!isProcessing && video.readyState === video.HAVE_ENOUGH_DATA) {
        isProcessing = true;

        const context = canvas.getContext('2d');
        const cropWidth = video.videoWidth * 0.75;
        const cropHeight = 120;
        const cropX = (video.videoWidth - cropWidth) / 2;
        const cropY = (video.videoHeight - cropHeight) / 2;

        canvas.width = cropWidth;
        canvas.height = cropHeight;
        context.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

        const { data: { text } } = await worker.recognize(canvas);
        const cleanText = text.trim().replace(/[^0-9-]/g, '');

        if (cleanText.length >= 4) {
          readNumberEl.innerText = `Gelesen: ${cleanText}`;
          lookupShelf(cleanText);
        }

        isProcessing = false;
      }
      setTimeout(() => { requestAnimationFrame(processFrame); }, 300);
    }

    function lookupShelf(articleNumber) {
      if (inventoryDatabase[articleNumber]) {
        shelfLocationEl.innerText = inventoryDatabase[articleNumber];
        shelfLocationEl.style.color = "#00ffcc";
      } else {
        const matchedKey = Object.keys(inventoryDatabase).find(key => key.includes(articleNumber));
        if (matchedKey) {
          shelfLocationEl.innerText = inventoryDatabase[matchedKey];
          shelfLocationEl.style.color = "#00ffcc";
        } else {
          shelfLocationEl.innerText = "NICHT GEFUNDEN";
          shelfLocationEl.style.color = "#ff4444";
        }
      }
    }

    window.onload = function() {
      loadSavedDatabase();
      startCamera();
    };
  </script>
</body>
</html>
